<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In</title>
    <style>
        /* Reset and base styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            margin: 0; padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e0e0e0;
        }

        .login-container {
            background: #1e1e1e;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
            width: 340px;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 24px;
            text-align: center;
            color: #ffffff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        input[type="email"],
        input[type="password"] {
            padding: 12px 16px;
            border: 1.5px solid #444;
            border-radius: 6px;
            font-size: 15px;
            background-color: #2c2c2c;
            color: #e0e0e0;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #888;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #00aaff;
            background-color: #383838;
            outline: none;
        }

        button {
            padding: 14px;
            background-color: #00aaff;
            color: #fff;
            border: none;
            font-size: 17px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 170, 255, 0.6);
        }

        button:hover {
            background-color: #008ecc;
            box-shadow: 0 6px 14px rgba(0, 142, 204, 0.8);
        }

        .form-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }

        .form-footer a {
            color: #00aaff;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Sign In</h2>
    <div th:if="${loginError}">
        <p th:text="${loginError}"></p>
    </div>
    <form method="post" action="/login">
        <input type="email" name="email" placeholder="Email" required autofocus />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
    </form>
    <div class="form-footer">
        <p>Don't have an account? <a href="/user/register">Register</a></p>
        <p><a href="/user/forgot-password">Forgot password?</a></p>
    </div>
</div>
</body>
</html>
